name: Build Staix macOS x64

on:
  workflow_dispatch:
  push:
    branches:
      - codex/staix-mac-subagents-v1.0.2

permissions:
  contents: read

concurrency:
  group: staix-macos-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dmg:
    runs-on: macos-15-intel
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check
        run: |
          npm run check
          git diff --exit-code

      - name: Build runtime packages
        run: npm run build

      - name: Build unsigned Intel app
        run: npm --workspace @pi-agent/windows-client run dist:mac:x64:unsigned

      - name: Create and verify DMG
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find . -path '*/release/*' \( -name 'Staix.app' -o -name 'staix.app' \) -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Staix.app was not produced" >&2
            find . -path '*/release/*' -print >&2
            exit 1
          fi

          executable="$app_path/Contents/MacOS/staix"
          file "$executable"
          file "$executable" | grep -q "x86_64"

          staging="$RUNNER_TEMP/staix-dmg"
          mkdir -p "$staging"
          ditto "$app_path" "$staging/Staix.app"
          ln -s /Applications "$staging/Applications"

          dmg="packages/windows-client/release/Staix-1.0.2-x64.dmg"
          hdiutil create -volname "Staix 1.0.2" -srcfolder "$staging" -ov -format UDZO "$dmg"
          hdiutil verify "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Staix-1.0.2-x64-macos
          path: |
            packages/windows-client/release/Staix-1.0.2-x64.dmg
            packages/windows-client/release/Staix-1.0.2-x64.dmg.sha256
          if-no-files-found: error
          retention-days: 14
